services:
  # Provider PO token (bgutil). Chỉ expose trong mạng nội bộ compose, KHÔNG publish ra ngoài (server này không có xác thực).
  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider
    init: true
    restart: unless-stopped
    expose:
      - "4416"

  muse:
    build:
      context: .
      args:
        # WITH_WPC=1 để thêm plugin wpc (Chromium) – thử nghiệm, image nặng hơn nhiều.
        WITH_WPC: ${WITH_WPC:-0}
    restart: unless-stopped
    depends_on:
      - bgutil
    environment:
      - YT_POT_URL=http://bgutil:4416
      - YT_WPC=${WITH_WPC:-0}
      # Khi WITH_WPC=1 đặt YTDLP_PATH=/usr/local/bin/yt-dlp-wpc và YT_CHROME=/usr/bin/chromium trong file .env
      - YTDLP_PATH=${YTDLP_PATH:-/usr/local/bin/yt-dlp}
      - YT_CHROME=${YT_CHROME:-}
      - DONATE_URL=${DONATE_URL:-}
      - YT_PROXY=${YT_PROXY:-}
      - SERVE_MUSIC=${SERVE_MUSIC:-}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - ADMIN_USER=${ADMIN_USER:-}
      - ADMIN_PASS=${ADMIN_PASS:-}
      - ADMIN_NAME=${ADMIN_NAME:-}
      - ADMIN_PAIR_KEY=${ADMIN_PAIR_KEY:-}
    volumes:
      - ./data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - muse

volumes:
  caddy_data:
