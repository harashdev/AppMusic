name: Build native (Muse, egui)

on:
  workflow_dispatch:
    inputs:
      muse_url:
        description: "Địa chỉ server mặc định điền sẵn ở màn hình đăng nhập (vd. https://muse.example.com)"
        required: false
        default: "http://100.112.197.104:3000"

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      MUSE_URL: ${{ inputs.muse_url || vars.MUSE_URL }}
    defaults:
      run:
        working-directory: muse-v0.5/muse/client
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: muse-v0.5/muse/client

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: muse-native-windows
          path: muse-v0.5/muse/client/target/release/muse-native.exe
