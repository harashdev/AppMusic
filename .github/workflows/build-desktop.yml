name: Build desktop (Muse)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      MUSE_URL: ${{ vars.MUSE_URL }}
    defaults:
      run:
        working-directory: muse-v0.5/muse/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: muse-v0.5/muse/desktop/src-tauri

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      # Cổng nhà: build muse-server rồi chép vào binaries/ để Tauri nhét cạnh file .exe (xem desktop/src-tauri/src/lib.rs).
      - name: Build muse-server (cổng nhà)
        shell: bash
        working-directory: muse-v0.5/muse/server
        run: |
          cargo build --release --features embed-ui
          mkdir -p ../desktop/src-tauri/binaries
          cp target/release/BBeat-server.exe ../desktop/src-tauri/binaries/muse-server-x86_64-pc-windows-msvc.exe

      - name: Tải Discord Social SDK
        id: sdk
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download discord-sdk -p 'DiscordSocialSdk-*.zip' -D "$RUNNER_TEMP/sdkzip" -R "$GITHUB_REPOSITORY"; then
            Z=$(ls "$RUNNER_TEMP"/sdkzip/*.zip | head -1)
            mkdir -p "$RUNNER_TEMP/sdk"
            unzip -q "$Z" "discord_social_sdk/include/*" "discord_social_sdk/lib/release/discord_partner_sdk.lib" "discord_social_sdk/bin/release/discord_partner_sdk.dll" -d "$RUNNER_TEMP/sdk"
            mkdir -p muse-v0.5/muse/desktop/src-tauri/sdk
            cp "$RUNNER_TEMP/sdk/discord_social_sdk/bin/release/discord_partner_sdk.dll" muse-v0.5/muse/desktop/src-tauri/sdk/
            echo "DISCORD_SDK_DIR=$(cygpath -w "$RUNNER_TEMP/sdk/discord_social_sdk")" >> "$GITHUB_ENV"
            echo "has=1" >> "$GITHUB_OUTPUT"
          else
            echo "has=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate icons
        run: cargo tauri icon ../icon-source.png

      - name: Build
        shell: bash
        run: |
          if [ "${{ steps.sdk.outputs.has }}" = "1" ]; then
            cargo tauri build --config tauri.sdk.conf.json
          else
            cargo tauri build
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: muse-windows
          path: |
            muse-v0.5/muse/desktop/src-tauri/target/release/bundle/nsis/*.exe
            muse-v0.5/muse/desktop/src-tauri/target/release/bundle/msi/*.msi

  build-server:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: muse-v0.5/muse/server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: muse-v0.5/muse/server
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir -p ../dist/muse-server
          cp target/release/BBeat-server.exe ../dist/muse-server/
          cp -r static ../dist/muse-server/static
          cp start-muse.bat ../dist/muse-server/
          cp start-gateway.bat ../dist/muse-server/
      - uses: actions/upload-artifact@v4
        with:
          name: muse-server-windows
          path: muse-v0.5/muse/dist/muse-server
