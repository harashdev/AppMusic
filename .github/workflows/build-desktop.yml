name: Build desktop (Muse)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      MUSE_URL: ${{ vars.MUSE_URL }}
    defaults:
      run:
        working-directory: muse-v0.5/muse/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: muse-v0.5/muse/desktop/src-tauri

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Generate icons
        run: cargo tauri icon ../icon-source.png

      - name: Build
        run: cargo tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: muse-windows
          path: |
            muse-v0.5/muse/desktop/src-tauri/target/release/bundle/nsis/*.exe
            muse-v0.5/muse/desktop/src-tauri/target/release/bundle/msi/*.msi

  build-server:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: muse-v0.5/muse/server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: muse-v0.5/muse/server
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir -p ../dist/muse-server
          cp target/release/muse-server.exe ../dist/muse-server/
          cp -r static ../dist/muse-server/static
      - uses: actions/upload-artifact@v4
        with:
          name: muse-server-windows
          path: muse-v0.5/muse/dist/muse-server
