name: Build server (Muse)

on:
  workflow_dispatch:
  push:
    paths:
      - "muse-v0.5/muse/server/**"
      - ".github/workflows/build-server.yml"

jobs:
  build-server:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: muse-v0.5/muse/server
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: muse-v0.5/muse/server

      - name: Build (release)
        run: cargo build --release

      - name: Đóng gói
        shell: bash
        run: |
          mkdir -p dist/data
          cp target/release/BBeat-server.exe dist/muse-server.exe
          cp -r static dist/static
          cp start-muse.bat dist/
          echo "Thư mục lưu dữ liệu Muse (tài khoản, playlist, ảnh). Đừng xoá khi cập nhật server." > dist/data/README.txt

      - name: Tải sẵn yt-dlp và deno
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "dist/yt-dlp.exe"
          Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive -Force "deno.zip" -DestinationPath "dist"
          Remove-Item "deno.zip"
          foreach ($f in "muse-server.exe","yt-dlp.exe","deno.exe","start-muse.bat","static/index.html") {
            if (-not (Test-Path "dist/$f")) { throw "Thiếu dist/$f" }
          }
          Get-ChildItem dist -Recurse | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: muse-server-windows
          path: muse-v0.5/muse/server/dist
          if-no-files-found: error
