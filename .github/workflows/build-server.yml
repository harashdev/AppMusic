name: Build server (Muse)

on:
  workflow_dispatch:
  push:
    paths:
      - "muse-v0.5/muse/server/**"
      - ".github/workflows/build-server.yml"

jobs:
  build-server:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: muse-v0.5/muse/server
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: muse-v0.5/muse/server

      - name: Build (release)
        run: cargo build --release

      # Gói sẵn: muse-server.exe + static/ + start-muse.bat (server đọc thư mục static cạnh nơi chạy).
      - name: Đóng gói
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/muse-server.exe dist/
          cp -r static dist/static
          cp start-muse.bat dist/

      - uses: actions/upload-artifact@v4
        with:
          name: muse-server-windows
          path: muse-v0.5/muse/server/dist
          if-no-files-found: error
