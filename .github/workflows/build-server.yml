name: Build server (Muse)

on:
  workflow_dispatch:
  push:
    paths:
      - "muse-v0.5/muse/server/**"
      - ".github/workflows/build-server.yml"

permissions:
  contents: write   # để đăng bản server lên Releases

# Hai lần push sát nhau không được chạy chồng lên nhau: lần này xoá/ghi đè file trên Release trong lúc lần kia đang tải lên => lỗi 404.
concurrency:
  group: build-server-release
  cancel-in-progress: false

jobs:
  build-server:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: muse-v0.5/muse/server
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: muse-v0.5/muse/server

      - name: Build (release)
        run: cargo build --release

      - name: Đóng gói
        shell: bash
        run: |
          mkdir -p dist/data
          cp target/release/muse-server.exe dist/
          cp -r static dist/static
          cp start-muse.bat dist/
          echo "Thư mục lưu dữ liệu Muse (tài khoản, playlist, ảnh). Đừng xoá khi cập nhật server." > dist/data/README.txt

      - name: Tải sẵn yt-dlp và deno
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "dist/yt-dlp.exe"
          Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive -Force "deno.zip" -DestinationPath "dist"
          Remove-Item "deno.zip"
          foreach ($f in "muse-server.exe","yt-dlp.exe","deno.exe","start-muse.bat","static/index.html") {
            if (-not (Test-Path "dist/$f")) { throw "Thiếu dist/$f" }
          }
          Get-ChildItem dist -Recurse | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: muse-server-windows
          path: muse-v0.5/muse/server/dist
          if-no-files-found: error

      # Đăng bản server lên Releases (tag server-latest, ghi đè bản cũ): không tính vào hạn mức artifact.
      - name: Đăng server lên Releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          powershell -NoProfile -Command "Compress-Archive -Path dist/* -DestinationPath muse-server-windows.zip -Force"
          TAG=server-latest
          # Thử tối đa 4 lần; mỗi lần đều kiểm tra lại Release còn tồn tại (nếu bị xoá thì tạo lại) vì upload đôi khi trả 404 thoáng qua.
          ok=0
          for i in 1 2 3 4; do
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target "${{ github.sha }}" \
              --title "Muse server - bản build mới nhất" --notes "Server Windows (kèm yt-dlp, deno) tự build bởi GitHub Actions." || true
            if gh release upload "$TAG" muse-server-windows.zip --clobber; then ok=1; break; fi
            echo "Upload lần $i lỗi, thử lại sau $((i*10)) giây…"; sleep $((i*10))
          done
          [ "$ok" = 1 ] || { echo "Không đăng được server lên Releases"; exit 1; }
