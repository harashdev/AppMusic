name: Build Android (BBeat)

on:
  workflow_dispatch:
  push:
    paths:
      - "muse-v0.5/muse/android/**"
      - "muse-v0.5/muse/native/**"
      - ".github/workflows/build-android.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUSE_URL: ${{ vars.MUSE_URL }}
    defaults:
      run:
        working-directory: muse-v0.5/muse/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tải Discord Social SDK
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download discord-sdk -p 'DiscordSocialSdk-*.zip' -D "$RUNNER_TEMP/sdkzip" -R "$GITHUB_REPOSITORY"; then
            Z=$(ls "$RUNNER_TEMP"/sdkzip/*.zip | head -1)
            mkdir -p "$RUNNER_TEMP/sdk"
            unzip -q "$Z" "discord_social_sdk/include/*" "discord_social_sdk/lib/release/discord_partner_sdk.aar" -d "$RUNNER_TEMP/sdk"
            mkdir -p "$RUNNER_TEMP/aar" muse-v0.5/muse/android/app/libs
            cp "$RUNNER_TEMP/sdk/discord_social_sdk/lib/release/discord_partner_sdk.aar" muse-v0.5/muse/android/app/libs/
            unzip -q "$RUNNER_TEMP/sdk/discord_social_sdk/lib/release/discord_partner_sdk.aar" -d "$RUNNER_TEMP/aar"
            echo "DISCORD_SDK_DIR=$RUNNER_TEMP/sdk/discord_social_sdk" >> "$GITHUB_ENV"
            echo "DISCORD_AAR_DIR=$RUNNER_TEMP/aar" >> "$GITHUB_ENV"
            echo "Đã gắn Discord SDK"
          else
            echo "Không có release discord-sdk, build không kèm SDK"
          fi

      - name: Build APK (debug-signed, cài thẳng được)
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Đổi tên APK thành BBeat.apk
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BBeat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bbeat-android
          path: muse-v0.5/muse/android/app/build/outputs/apk/debug/BBeat.apk
          if-no-files-found: error

      - name: Upload build reports (khi lỗi)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: muse-v0.5/muse/android/app/build/reports
          if-no-files-found: ignore
