name: Build Android (BBeat)

on:
  workflow_dispatch:
  push:
    paths:
      - "muse-v0.5/muse/android/**"
      - "muse-v0.5/muse/native/**"
      - "muse-v0.5/muse/server/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write   # để đăng APK lên Releases

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUSE_URL: ${{ vars.MUSE_URL }}
    defaults:
      run:
        working-directory: muse-v0.5/muse/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tải Discord Social SDK
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download discord-sdk -p 'DiscordSocialSdk-*.zip' -D "$RUNNER_TEMP/sdkzip" -R "$GITHUB_REPOSITORY"; then
            Z=$(ls "$RUNNER_TEMP"/sdkzip/*.zip | head -1)
            mkdir -p "$RUNNER_TEMP/sdk"
            unzip -q "$Z" "discord_social_sdk/include/*" "discord_social_sdk/lib/release/discord_partner_sdk.aar" -d "$RUNNER_TEMP/sdk"
            mkdir -p "$RUNNER_TEMP/aar" muse-v0.5/muse/android/app/libs
            cp "$RUNNER_TEMP/sdk/discord_social_sdk/lib/release/discord_partner_sdk.aar" muse-v0.5/muse/android/app/libs/
            unzip -q "$RUNNER_TEMP/sdk/discord_social_sdk/lib/release/discord_partner_sdk.aar" -d "$RUNNER_TEMP/aar"
            echo "DISCORD_SDK_DIR=$RUNNER_TEMP/sdk/discord_social_sdk" >> "$GITHUB_ENV"
            echo "DISCORD_AAR_DIR=$RUNNER_TEMP/aar" >> "$GITHUB_ENV"
            echo "Đã gắn Discord SDK"
          else
            echo "Không có release discord-sdk, build không kèm SDK"
          fi

      # Nhạc YouTube lấy ngay trên điện thoại: build muse-server (chế độ AUDIO_ONLY) cho Android arm64 và nhét vào APK
      # dưới tên libmuse_audio.so. Bước này lỗi thì APK vẫn build được, chỉ là nhạc đi qua server như trước.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: muse-v0.5/muse/server

      - name: Build muse-server cho Android (audio cục bộ)
        continue-on-error: true
        working-directory: muse-v0.5/muse/server
        run: |
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          cargo ndk -t arm64-v8a --platform 26 build --release
          mkdir -p ../android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/BBeat-server ../android/app/src/main/jniLibs/arm64-v8a/libmuse_audio.so
          ls -l ../android/app/src/main/jniLibs/arm64-v8a/

      - name: Báo nếu thiếu libmuse_audio.so (app vẫn phát bằng NativeYt.kt)
        shell: bash
        run: |
          if [ ! -f app/src/main/jniLibs/arm64-v8a/libmuse_audio.so ]; then
            echo "::warning::Không build được libmuse_audio.so; app dùng bản Kotlin NativeYt để lấy nhạc bằng IP điện thoại."
          fi

      - name: Build APK (debug-signed, cài thẳng được)
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Đổi tên APK thành BBeat.apk
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BBeat.apk

      # Kho artifact của repo hay đầy hạn mức (lỗi "Artifact storage quota has been hit"), nên không để nó làm hỏng cả lần build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: bbeat-android
          path: muse-v0.5/muse/android/app/build/outputs/apk/debug/BBeat.apk
          if-no-files-found: error

      # Đăng APK lên Releases (tag android-latest, ghi đè bản cũ): tải ở mục Releases, không tính vào hạn mức artifact.
      - name: Đăng APK lên Releases
        # Chỉ nhánh main mới ghi đè bản tải về; nhánh thử nghiệm vẫn build để kiểm tra biên dịch, APK lấy ở mục Artifacts.
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          APK=muse-v0.5/muse/android/app/build/outputs/apk/debug/BBeat.apk
          TAG=android-latest
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target "${{ github.sha }}" \
            --title "BBeat - bản build mới nhất" --notes "APK tự build bởi GitHub Actions (cài thẳng được)."
          gh release upload "$TAG" "$APK" --clobber
          echo "APK: https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build reports (khi lỗi)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: muse-v0.5/muse/android/app/build/reports
          if-no-files-found: ignore
